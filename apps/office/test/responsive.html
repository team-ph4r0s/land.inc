<body>

      <table class="test-table" id="results-table">
        <thead>
          <tr>
            <th>Вкладка</th>
            <th>Ширина</th>
            <th>Тема</th>
            <th>scrollWidth / clientWidth</th>
            <th>Результат</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <div id="frame-wrapper" class="device-viewport-frame device-width-390 device-height-tall">
      <div class="top-bar">
        <span class="logo">land.inc 1.5</span>
        <div id="mcp-host"></div>
        <div class="status-summary">
          <span class="badge ok">online</span>
        </div>
      </div>
      <aside id="sidebar"></aside>
    </div>
  </main>

    model: 'gpt-5-codex',

const mcpList = [

  { id: 'filesystem', name: 'Local FS Access', state: 'active', version: '2.0.0' },
  { id: 'postgres', name: 'PostgreSQL DB', state: 'installing' },

const teamRuns = [
  {
    id: 'teamrun-rel-15',
    title: 'Релиз land.inc 1.5',
    topology: 'review-loop',
    status: 'running',
    startedAt: Date.now() - 60000,
    currentStepIndex: 1,
    currentIteration: 2,
    maxIterations: 3,
    steps: [
      {
        index: 0,
        spec: { role: 'coder', agentId: 'agent-codex', model: 'gpt-5-codex', kind: 'write', produces: 'code' },
        status: 'done',
        startedAt: Date.now() - 60000,
        finishedAt: Date.now() - 25000,
        artifact: {
          kind: 'code',
          size: 4096,

          verdict: 'APPROVED',

        }
      },
      {

        spec: { role: 'reviewer', agentId: 'agent-gemini', model: 'gemini-2.5-pro', kind: 'review', produces: 'review' },
        status: 'running',

      }
    ]
  }
];
store.setTeams(teamRuns, BUILTIN_PRESETS);

const doctorChecks = [
  { id: 'cli-claude', title: 'Claude CLI', status: 'ok', detail: 'Claude Code 1.5.0 найден и активен' },
  { id: 'cli-codex', title: 'Codex CLI', status: 'ok', detail: 'Codex CLI 1.5.0 готов к запуску' },
  { id: 'cli-antigravity', title: 'Antigravity CLI', status: 'ok', detail: 'Antigravity CLI 2.0 обнаружен' },
  { id: 'mcp-jira', title: 'MCP Jira', status: 'warn', detail: 'Плагин отсутствует в конфигурации', fix: true },
  { id: 'mcp-docker', title: 'MCP Docker', status: 'fail', detail: 'Не удалось подключиться к Docker сокету' }
];
store.setDoctorChecks(doctorChecks);

// Mount DOM Components
const sidebarEl = document.querySelector('#sidebar');
const sidebar = new Sidebar(sidebarEl, () => {}, send);

// Mount MCP Menu in Top Bar
const mcpHost = document.querySelector('#mcp-host');
const mcpMenu = new McpMenuComponent(mcpHost, send);

// Mount Meeting Panel
const meetingPanel = new MeetingPanel(sidebar.teamPane, send);
meetingPanel.updateCatalog(catalog);
meetingPanel.setTeams(teamRuns, BUILTIN_PRESETS);

// Mount Settings Panel
const settingsPanel = new SettingsPanel(sidebar.settingsPane, send);

// Mount Tasks Panel
const boardPanel = new TaskBoardPanel(sidebar.tasksPane, send, () => {});
const boardConfig = {
  projects: ['C:/dev/land.inc'],
  outsideGit: [],
  executors: {
    claude: { available: true, models: catalog.models.filter(m => m.provider === 'claude') },
    codex: { available: true, models: catalog.models.filter(m => m.provider === 'codex') },
    antigravity: { available: true, models: catalog.models.filter(m => m.provider === 'antigravity') }
  }
};
const conversations = [
  { id: 'c1', prompt: 'Проверить отсутствие inline-стилей', result: 'Проверено 100% файлов: везде классы и переменные!', cwd: 'C:/dev/land.inc', executor: 'codex', model: 'gpt-5-codex', access: 'full', status: 'done', createdAt: Date.now() - 100000, agentId: 'c1-agent', pinned: true },
  { id: 'c2', prompt: 'Собрать проект и пройти тайпчек', result: 'tsc -p apps/daemon && tsc -p apps/office прошли успешно без ошибок.', cwd: 'C:/dev/land.inc', executor: 'claude', model: 'claude-3-7-sonnet', access: 'full', status: 'done', createdAt: Date.now() - 50000, agentId: 'c2-agent' }
];
boardPanel.setBoard(boardConfig, conversations);

// Render Employees
sidebar.renderAgents(new Map(), new Map());

// Viewport width switcher
const frameWrapper = document.querySelector('#frame-wrapper');
document.querySelectorAll('[data-w]').forEach((btn) => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-w]').forEach(b => b.classList.remove('primary'));
    btn.classList.add('primary');
    const w = btn.dataset.w;
    frameWrapper.className = 'device-viewport-frame device-height-tall ' + (w === 'auto' ? 'device-width-auto' : `device-width-${w}`);
  });
});

// Theme switcher
const themeBtn = document.querySelector('#theme-btn');
themeBtn.addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || 'dark';
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  themeBtn.textContent = `Тема: ${next === 'dark' ? 'Тёмная' : 'Светлая'}`;
});

// Automated Layout & Horizontal Overflow Audit
const runAuditBtn = document.querySelector('#run-audit-btn');
const resultsBox = document.querySelector('#results-box');
const resultsTbody = document.querySelector('#results-table tbody');
const auditStatus = document.querySelector('#audit-status');

async function runOverflowAudit() {
  auditStatus.textContent = 'Выполняется аудит…';
  resultsBox.hidden = false;
  resultsTbody.innerHTML = '';

  const widths = [360, 390, 768];
  const themes = ['dark', 'light'];
  const tabs = ['office', 'tasks', 'team', 'dns', 'settings', 'updates'];

  let totalChecks = 0;
  let passedChecks = 0;

  for (const theme of themes) {
    document.documentElement.setAttribute('data-theme', theme);
    themeBtn.textContent = `Тема: ${theme === 'dark' ? 'Тёмная' : 'Светлая'}`;

    for (const width of widths) {
      frameWrapper.className = `device-viewport-frame device-height-tall device-width-${width}`;
      // Allow browser reflow
      await new Promise(r => setTimeout(r, 60));

      for (const tab of tabs) {
        sidebar.showTab(tab);
        await new Promise(r => setTimeout(r, 30));

        const pane = sidebarEl.querySelector(`.pane.${tab}`);
        if (!pane) continue;

        totalChecks++;
        const sWidth = pane.scrollWidth;
        const cWidth = pane.clientWidth;
        const isOk = sWidth <= cWidth + 1; // 1px subpixel tolerance
        if (isOk) passedChecks++;

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${tab}</strong></td>
          <td>${width}px</td>
          <td>${theme}</td>
          <td>${sWidth} / ${cWidth} px</td>
          <td>
            <span class="${isOk ? 'test-pill-pass' : 'test-pill-fail'}">
              ${isOk ? 'PASS (0 overflow)' : `FAIL (+${sWidth - cWidth}px)`}
            </span>
          </td>
        `;
        resultsTbody.appendChild(tr);
      }
    }
  }

  // Restore 390px dark default
  frameWrapper.className = 'device-viewport-frame device-height-tall device-width-390';
  document.documentElement.setAttribute('data-theme', 'dark');
  themeBtn.textContent = 'Тема: Тёмная';
  sidebar.showTab('office');

  const allPassed = passedChecks === totalChecks;
  auditStatus.textContent = allPassed
    ? `Аудит завершён: ВСЕ ${totalChecks} проверок успешно пройдены! 0 переполнений.`
    : `Аудит выявил ошибки: ${totalChecks - passedChecks} из ${totalChecks} не прошли.`;
  auditStatus.className = allPassed ? 'badge ok' : 'badge bad';
}

runAuditBtn.addEventListener('click', runOverflowAudit);

// Auto-run audit on page load
setTimeout(runOverflowAudit, 150);
</script>
</body>
</html>
